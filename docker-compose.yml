services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: techno-hogar-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-techno_hogar}
      MYSQL_USER: ${DB_USERNAME:-techno_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-techno_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - techno-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techno-hogar-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-techno_user}
      DB_PASSWORD: ${DB_PASSWORD:-techno_password}
      DB_DATABASE: ${DB_DATABASE:-techno_hogar}
      PORT: 3000
      # Auth - REQUIRED in production
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # CORS - Set to your frontend URL in production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Optional services
      WHATSAPP_NOTIFICATIONS_ENABLED: ${WHATSAPP_NOTIFICATIONS_ENABLED:-false}
      WHATSAPP_ADMIN_PHONE: ${WHATSAPP_ADMIN_PHONE:-}
      GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - techno-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: npm run start:dev

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techno-hogar-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_WHATSAPP_PHONE: ${VITE_WHATSAPP_PHONE:-5218441972327}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - techno-network
    command: npm run dev -- --host

volumes:
  mysql_data:
    driver: local

networks:
  techno-network:
    driver: bridge
